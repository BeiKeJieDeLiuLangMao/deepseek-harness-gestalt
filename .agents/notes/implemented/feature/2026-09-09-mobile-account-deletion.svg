<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="440" viewBox="0 0 1500 440"><rect width="1500" height="440" fill="#f6f7f9"/><g font-family="system-ui,sans-serif" fill="#202124"><text x="30" y="30" font-size="17">入口</text><rect x="18" y="45" width="282" height="365" rx="22" fill="white" stroke="#ddd"/><text x="36" y="98" font-size="22">账户</text><text x="36" y="151" font-size="15">GitHub 已登录</text><rect x="36" y="274" width="246" height="42" rx="12" fill="#eceef1"/><text x="53" y="302" font-size="16">退出登录</text><text x="53" y="363" font-size="16" fill="#b42318">删除账号</text><text x="328" y="30" font-size="17">确认</text><rect x="316" y="45" width="282" height="365" rx="22" fill="white" stroke="#ddd"/><text x="334" y="98" font-size="22">删除账号？</text><text x="334" y="151" font-size="15">选择共享项目继任 owner</text><text x="334" y="180" font-size="13">撤销全部安装与配对；保留本地文件</text><rect x="334" y="274" width="246" height="42" rx="12" fill="#eceef1"/><text x="351" y="302" font-size="16">取消</text><text x="351" y="363" font-size="16" fill="#b42318">删除账号</text><text x="626" y="30" font-size="17">进行中</text><rect x="614" y="45" width="282" height="365" rx="22" fill="white" stroke="#ddd"/><text x="632" y="98" font-size="22">正在删除账号</text><text x="632" y="151" font-size="15">重新打开后继续查询进度</text><rect x="632" y="274" width="246" height="42" rx="12" fill="#eceef1"/><text x="649" y="302" font-size="16">普通操作不可用</text><text x="924" y="30" font-size="17">完成</text><rect x="912" y="45" width="282" height="365" rx="22" fill="white" stroke="#ddd"/><text x="930" y="98" font-size="22">账号已删除</text><text x="930" y="151" font-size="15">已清除该账号本地材料</text><rect x="930" y="274" width="246" height="42" rx="12" fill="#eceef1"/><text x="947" y="302" font-size="16">返回登录</text><text x="1222" y="30" font-size="17">恢复失败</text><rect x="1210" y="45" width="282" height="365" rx="22" fill="white" stroke="#ddd"/><text x="1228" y="98" font-size="22">无法确认删除状态</text><text x="1228" y="151" font-size="15">继任者离开可通过原回执重选</text><rect x="1228" y="274" width="246" height="42" rx="12" fill="#eceef1"/><text x="1245" y="302" font-size="16">重试 / 重选继任者</text></g></svg>
