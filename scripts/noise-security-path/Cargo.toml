[package]
name = "dsh-noise-security-path-proof"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
getrandom = { version = "0.3.4", features = ["wasm_js"] }
hex = "0.4.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
snow = { version = "=0.10.0", default-features = false, features = ["default-resolver", "use-curve25519", "use-chacha20poly1305", "use-sha2", "use-getrandom", "vector-tests"] }
wasm-bindgen = "=0.2.127"

[profile.release]
lto = true
opt-level = "s"
strip = true
