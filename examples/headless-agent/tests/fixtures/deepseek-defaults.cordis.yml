- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ../../cordis.yml
    patches:
      - id: llm-deepseek
        config:
          baseURL: !!js process.env.DSH_SNAPSHOT_BASE_URL
          thinking: enabled
          reasoningEffort: low
          # Must match DEEPSEEK_DEFAULTS_STREAM_IDLE_TIMEOUT_MS in
          # headless.snapshot.ts. Comments arrive every 2s; the payload
          # waits 7s so a missing pulse would expire this budget.
          streamIdleTimeoutMs: 5000
      - id: agent-spine
        config:
          agents:
            - id: main
              provider: deepseek-official
              model: deepseek-v4-flash
              cwd: !!js process.cwd()
          workspaceContext: false
          persona: 'Keyless DeepSeek adapter defaults snapshot.'
      - id: persistence
        config:
          root: './.sessions'
