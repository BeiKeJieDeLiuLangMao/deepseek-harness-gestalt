# Keyless replay preserves the deferred SDK composition and replaces only the
# live model adapter with the fixture-backed provider.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./deferred.cordis.yml
    patches:
      - id: base
        config:
          path: ./cordis.yml
          patches:
            - id: llm-deepseek
              name: '@deepseek-ai/dsh-llm-deepseek'
              disabled: true
            - id: agent-spine
              config:
                persona: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are a coding agent.'
                workspaceContext: false
                skills:
                  enabled: false
                toolBash:
                  enableRunInBackground: false
                toolJobs: false
                tools:
                  toolSearch:
                    maxResultBytes: 65536
            - insert:
                - id: llm-replay
                  name: '@deepseek-ai/dsh-llm-replay'
                  config:
                    providers:
                      - id: deepseek-official
                        name: DeepSeek
                        models:
                          - id: deepseek-v4-flash
                - id: deferred-sdk-tool
                  name: './tests/fixtures/deferred-sdk-tool.ts'
