name: One-time DeepSeek CI secret migration

on:
  push:
    branches:
      - codex/migrate-deepseek-secret-20260912

permissions:
  contents: read

jobs:
  seal-secret:
    name: Seal secret for gestaltrun/deepseek-harness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Seal source secret with the target repository public key
        shell: bash
        env:
          SOURCE_SECRET: ${{ secrets.DEEPSEEK_API_KEY_EXTERNAL }}
          TARGET_PUBLIC_KEY: qk0OJcjb8wdbYhHY8eyJxDTNRfgnc7PgWJqB7KjHYiA=
        run: |
          set -euo pipefail
          php <<'PHP'
          <?php
          $secret = getenv('SOURCE_SECRET');
          $encodedPublicKey = getenv('TARGET_PUBLIC_KEY');
          if ($secret === false || $secret === '') {
              fwrite(STDERR, "The source repository secret is unavailable.\n");
              exit(1);
          }
          if ($encodedPublicKey === false) {
              fwrite(STDERR, "The target repository public key is unavailable.\n");
              exit(1);
          }
          $publicKey = base64_decode($encodedPublicKey, true);
          if ($publicKey === false || strlen($publicKey) !== SODIUM_CRYPTO_BOX_PUBLICKEYBYTES) {
              fwrite(STDERR, "The target repository public key is invalid.\n");
              exit(1);
          }
          $ciphertext = sodium_crypto_box_seal($secret, $publicKey);
          sodium_memzero($secret);
          fwrite(STDOUT, 'SEALED_CIPHERTEXT=' . base64_encode($ciphertext) . "\n");
          ?>
          PHP
