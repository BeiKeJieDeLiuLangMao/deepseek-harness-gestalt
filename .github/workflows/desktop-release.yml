# Pack DeepSeek Gestalt installers and publish a GitHub Release for electron-updater.
# Pack runs on workflow_dispatch; publication requires a gestalt-v* tag.
name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Create a GitHub Release from the current gestalt-v* tag and upload installers.
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  pack-mac:
    name: Pack macOS ${{ matrix.arch }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Fetch official Node
        run: node apps/desktop/scripts/fetch-node.mjs --platform darwin --arch ${{ matrix.arch }}

      - name: Deploy dsh snapshot
        run: |
          pnpm --filter @deepseek-ai/dsh deploy --prod --legacy apps/desktop/resources/dsh
          node apps/desktop/scripts/isolate-dsh-snapshot.mjs

      - name: Package
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm --filter @deepseek-ai/dsh-desktop exec electron-builder --mac --${{ matrix.arch }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: gestalt-mac-${{ matrix.arch }}
          path: apps/desktop/release/*
          if-no-files-found: error
          retention-days: 14

  pack-win:
    name: Pack Windows x64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Fetch official Node
        run: node apps/desktop/scripts/fetch-node.mjs --platform win32 --arch x64

      - name: Deploy dsh snapshot
        run: |
          pnpm --filter @deepseek-ai/dsh deploy --prod --legacy apps/desktop/resources/dsh
          node apps/desktop/scripts/isolate-dsh-snapshot.mjs

      - name: Package
        run: pnpm --filter @deepseek-ai/dsh-desktop exec electron-builder --win --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: gestalt-win-x64
          path: apps/desktop/release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: GitHub Release
    if: inputs.publish
    needs: [pack-mac, pack-win]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Merge macOS update feeds
        run: node apps/desktop/scripts/merge-latest-mac.mjs dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${GITHUB_REF_NAME}
          case "$tag" in gestalt-v*) ;; *) echo "publish requires a gestalt-v* tag"; exit 1 ;; esac
          gh release create "$tag" dist/**/*.{dmg,zip,exe,yml,yaml} --title "$tag" --generate-notes
